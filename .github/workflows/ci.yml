name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          # Latest 1.26 patch, so govulncheck does not flag fixed stdlib CVEs.
          go-version: '1.26.x'
          check-latest: true
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
      # Integration tests start PostgreSQL with Testcontainers; the runner has Docker.
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
