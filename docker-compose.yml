services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: watchkeeper
      POSTGRES_USER: watchkeeper
      POSTGRES_PASSWORD: watchkeeper
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchkeeper -d watchkeeper"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
