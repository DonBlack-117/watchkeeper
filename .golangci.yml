version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
  settings:
    gosec:
      excludes:
        - G107 # the runner requests user-configured URLs by design
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx]
